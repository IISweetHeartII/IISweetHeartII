name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same generator the Platane/snk action wraps, but the contribution grid
      # is read from the public profile page instead of the GraphQL API, which
      # rejects this account's calendar query. See the patch for details.
      - name: Generate snake SVG
        run: |
          npm install --no-save generate-snake-animation@3.5.0
          node --import ./scripts/contribution-source-patch.mjs \
            node_modules/generate-snake-animation/cli.js \
            --github_user IISweetHeartII \
            --output dist/github-snake.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
